services:
  backend-core:
    build:
      context: .
      dockerfile: services/backend-core/Dockerfile
    container_name: tab-organizer-backend
    ports:
      # Loopback-only: see CLAUDE.md "Published ports are loopback-only".
      - "127.0.0.1:8080:8080"
    environment:
      - AI_ENGINE_URL=${AI_ENGINE_URL:-http://ai-engine:8090}
      - AI_ENGINE_API_TOKEN=${AI_ENGINE_API_TOKEN:-}
      - BROWSER_ENGINE_API_TOKEN=${BROWSER_ENGINE_API_TOKEN:-}
      - BACKEND_CALLBACK_TOKEN=${BACKEND_CALLBACK_TOKEN:-}
      - BACKEND_AGENT_API_TOKEN=${BACKEND_AGENT_API_TOKEN:-}
      - BROWSER_ENGINE_URL=${BROWSER_ENGINE_URL:-http://browser-engine:8083}
      - BACKEND_DB_PATH=/data/backend/tab-organizer.sqlite3
      - BACKEND_PUBLIC_URL=${BACKEND_PUBLIC_URL:-http://localhost:8080}
      - PLATFORM_MAINTAINER_SIGNUP_CODE=${PLATFORM_MAINTAINER_SIGNUP_CODE:-}
      - SCRAPE_ALLOW_PRIVATE_NETWORKS=${SCRAPE_ALLOW_PRIVATE_NETWORKS:-false}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
    depends_on:
      - ai-engine
      - browser-engine
    volumes:
      - backend-data:/data/backend
    networks:
      - tab-organizer-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    profiles: [default, dev]

  ai-engine:
    build:
      context: .
      dockerfile: services/ai-engine/Dockerfile
    container_name: tab-organizer-ai
    ports:
      - "127.0.0.1:8090:8090"
    environment:
      # No default on purpose (routing.silent_fallback: false). A `:-openrouter`
      # here would re-supply the very default the AI Engine now refuses to
      # invent, and the container would quietly spend metered credit nobody
      # chose. Unset means unset: the service starts, reports degraded, and
      # names the fix. Run `./scripts/cli.py configure-provider` to choose.
      - AI_PROVIDER=${AI_PROVIDER:-}
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-}
      - AI_ENGINE_API_TOKEN=${AI_ENGINE_API_TOKEN:-}
      - AI_ENGINE_ALLOW_UNAUTHENTICATED=${AI_ENGINE_ALLOW_UNAUTHENTICATED:-false}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      - LLM_MODEL=${LLM_MODEL:-}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-}
      - EMBEDDING_DIMENSIONS=${EMBEDDING_DIMENSIONS:-}
      - VECTOR_DB_PATH=/data/lancedb
      - OLLAMA_HOST=${OLLAMA_HOST:-http://ollama:11434}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      # The stock ai-engine image does not install Claude Code, Codex CLI, or acpx.
      # Use CLI/ACP providers with a host-run AI engine or a custom image that
      # includes the binaries/adapters and their authenticated state.
      - AGENT_CLI_WORKDIR=${AGENT_CLI_WORKDIR:-/tmp/tab-organizer-agent-cli}
      - AGENT_CLI_TIMEOUT=${AGENT_CLI_TIMEOUT:-300}
      - CLAUDE_CODE_COMMAND=${CLAUDE_CODE_COMMAND:-claude}
      - CLAUDE_CODE_TIMEOUT=${CLAUDE_CODE_TIMEOUT:-300}
      - CLAUDE_CODE_DISABLE_TOOLS=${CLAUDE_CODE_DISABLE_TOOLS:-true}
      - CLAUDE_CODE_EXTRA_ARGS=${CLAUDE_CODE_EXTRA_ARGS:-}
      - CODEX_CLI_COMMAND=${CODEX_CLI_COMMAND:-codex}
      - CODEX_CLI_TIMEOUT=${CODEX_CLI_TIMEOUT:-300}
      - CODEX_CLI_SANDBOX=${CODEX_CLI_SANDBOX:-read-only}
      - CODEX_CLI_ALLOW_UNTRUSTED_CONTEXT=${CODEX_CLI_ALLOW_UNTRUSTED_CONTEXT:-false}
      - CODEX_CLI_EXTRA_ARGS=${CODEX_CLI_EXTRA_ARGS:-}
      - CODEX_ACP_COMMAND=${CODEX_ACP_COMMAND:-acpx}
      - CODEX_ACP_TIMEOUT=${CODEX_ACP_TIMEOUT:-300}
      - CODEX_ACP_PERMISSION_MODE=${CODEX_ACP_PERMISSION_MODE:-deny-all}
      - CODEX_ACP_NON_INTERACTIVE_PERMISSIONS=${CODEX_ACP_NON_INTERACTIVE_PERMISSIONS:-fail}
      - CODEX_ACP_QUEUE_TTL_SECONDS=${CODEX_ACP_QUEUE_TTL_SECONDS:-0.1}
      - CODEX_ACP_SESSION_NAME=${CODEX_ACP_SESSION_NAME:-}
    depends_on:
      - ollama
    volumes:
      - lancedb-data:/data/lancedb
    networks:
      - tab-organizer-network
    restart: unless-stopped
    profiles: [default, dev]

  browser-engine:
    build:
      context: .
      dockerfile: services/browser-engine/Dockerfile
    container_name: tab-organizer-browser
    ports:
      - "127.0.0.1:8083:8083"
    environment:
      - BACKEND_URL=http://backend-core:8080
      - AI_ENGINE_URL=${AI_ENGINE_URL:-http://ai-engine:8090}
      - AI_ENGINE_API_TOKEN=${AI_ENGINE_API_TOKEN:-}
      - BROWSER_ENGINE_API_TOKEN=${BROWSER_ENGINE_API_TOKEN:-}
      - BACKEND_CALLBACK_TOKEN=${BACKEND_CALLBACK_TOKEN:-}
      - MAX_CONCURRENT_SCRAPES=${MAX_CONCURRENT_SCRAPES:-10}
      - SCRAPE_TIMEOUT=${SCRAPE_TIMEOUT:-30}
      - RESPECT_ROBOTS=${RESPECT_ROBOTS:-true}
      - SCRAPE_ALLOW_PRIVATE_NETWORKS=${SCRAPE_ALLOW_PRIVATE_NETWORKS:-false}
      - CREDENTIAL_ENCRYPTION_KEY=${CREDENTIAL_ENCRYPTION_KEY:-}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
    networks:
      - tab-organizer-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    profiles: [default, dev]

  web-ui:
    build:
      context: ./services/web-ui
      dockerfile: Dockerfile
    container_name: tab-organizer-ui
    ports:
      - "127.0.0.1:8089:8089"
    environment:
      - BACKEND_URL=http://backend-core:8080
      - AI_ENGINE_URL=${AI_ENGINE_URL:-http://ai-engine:8090}
      - AI_ENGINE_API_TOKEN=${AI_ENGINE_API_TOKEN:-}
      # Streamlit runs server-side; this token never reaches a browser. Needed
      # for the backend routes web-ui calls that now require the agent scope
      # (/chat, /auth/pending, /auth/credentials). BROWSER_ENGINE_API_TOKEN was
      # granted here but never read by any web-ui code -- removed.
      - BACKEND_AGENT_API_TOKEN=${BACKEND_AGENT_API_TOKEN:-}
      - BROWSER_ENGINE_URL=http://browser-engine:8083
    depends_on:
      - backend-core
    networks:
      - tab-organizer-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    profiles: [default, dev]

  ollama:
    image: ollama/ollama:latest
    container_name: tab-organizer-ollama
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - tab-organizer-network
    restart: unless-stopped
    profiles: [default, dev]

  test-unit:
    build:
      context: .
      dockerfile: tests/Dockerfile.test
    container_name: tab-organizer-test-unit
    command: pytest tests/unit -v --cov=services --cov-report=xml --cov-report=html --cov-report=term
    volumes:
      - ./tests:/app/tests
      - ./services:/app/services
      - ./config:/app/config
      - ./scripts:/app/scripts:ro
      - ./docs:/app/docs:ro
      - ./.github:/app/.github:ro
      - ./Makefile:/app/Makefile:ro
      - ./docker-compose.yml:/app/docker-compose.yml:ro
      - ./.env.example:/app/.env.example:ro
      - ./.gitleaks.toml:/app/.gitleaks.toml:ro
      - ./pytest.ini:/app/pytest.ini:ro
      - ./test-results:/app/test-results
      - ./coverage:/app/coverage
    networks:
      - tab-organizer-network
    profiles: [test-unit]

  test-integration:
    build:
      context: .
      dockerfile: tests/Dockerfile.test
    container_name: tab-organizer-test-integration
    command: pytest tests/integration -v --junit-xml=/app/test-results/integration-results.xml
    environment:
      - BACKEND_URL=http://backend-core:8080
      - AI_ENGINE_URL=http://ai-engine:8090
      - BROWSER_ENGINE_URL=http://browser-engine:8083
      - OLLAMA_HOST=http://ollama:11434
      - AI_ENGINE_API_TOKEN=${AI_ENGINE_API_TOKEN:-}
      - BACKEND_CALLBACK_TOKEN=${BACKEND_CALLBACK_TOKEN:-}
      - BROWSER_ENGINE_API_TOKEN=${BROWSER_ENGINE_API_TOKEN:-}
    volumes:
      - ./tests:/app/tests
      - ./services:/app/services
      - ./config:/app/config
      - ./test-results:/app/test-results
    depends_on:
      - backend-core
      - ai-engine
      - browser-engine
      - ollama
    networks:
      - tab-organizer-network
    profiles: [test-integration]

  test-e2e:
    build:
      context: .
      dockerfile: tests/Dockerfile.test
    container_name: tab-organizer-test-e2e
    command: pytest tests/e2e -v --junit-xml=/app/test-results/e2e-results.xml
    environment:
      - WEB_UI_URL=http://web-ui:8089
      - BACKEND_URL=http://backend-core:8080
      - AI_ENGINE_URL=http://ai-engine:8090
      - BROWSER_ENGINE_URL=http://browser-engine:8083
      - AI_ENGINE_API_TOKEN=${AI_ENGINE_API_TOKEN:-}
      - BACKEND_CALLBACK_TOKEN=${BACKEND_CALLBACK_TOKEN:-}
      - BROWSER_ENGINE_API_TOKEN=${BROWSER_ENGINE_API_TOKEN:-}
    volumes:
      - ./tests:/app/tests
      - ./test-results:/app/test-results
    depends_on:
      - web-ui
      - backend-core
      - ai-engine
      - browser-engine
      - ollama
    networks:
      - tab-organizer-network
    profiles: [test-e2e]

networks:
  tab-organizer-network:
    driver: bridge

volumes:
  backend-data:
  ollama-data:
  lancedb-data:
